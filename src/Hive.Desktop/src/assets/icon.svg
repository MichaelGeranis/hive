<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Hexagon (honeycomb) shape -->
  <path d="M256 96 L384 176 L384 336 L256 416 L128 336 L128 176 Z"
        fill="none"
        stroke="url(#hexGrad)"
        stroke-width="32"
        stroke-linejoin="round"/>

  <!-- Inner hexagon pattern -->
  <path d="M256 160 L328 200 L328 280 L256 320 L184 280 L184 200 Z"
        fill="url(#hexGrad)"
        opacity="0.3"/>

  <!-- Center dot -->
  <circle cx="256" cy="240" r="24" fill="url(#hexGrad)"/>
</svg>

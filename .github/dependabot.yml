# Weekly update PRs for every package ecosystem in the repository.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
    ignore:
      # FluentAssertions 8 is no longer free for commercial use; stay on 6.x
      - dependency-name: FluentAssertions
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /src/Hive.Desktop
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

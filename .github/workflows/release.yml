name: Release

# Builds the desktop installers on a version tag (v1.2.3) and attaches them to
# a draft GitHub release, to be checked and published by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            target: --mac
          - os: windows-latest
            rid: win-x64
            target: --win
          - os: ubuntu-latest
            rid: linux-x64
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The builds are not code-signed yet
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Hive.Desktop/package-lock.json

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: src/Hive.Desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Backend
        run: bash scripts/build-backend.sh ${{ matrix.rid }}

      - name: Desktop app
        working-directory: src/Hive.Desktop
        run: |
          npm ci
          npx vite build
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: hive-${{ matrix.rid }}
          path: |
            src/Hive.Desktop/release/*.dmg
            src/Hive.Desktop/release/*.zip
            src/Hive.Desktop/release/*.exe
            src/Hive.Desktop/release/*.AppImage
            src/Hive.Desktop/release/*.deb
          if-no-files-found: error

  release:
    name: Draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Hive $GITHUB_REF_NAME"
